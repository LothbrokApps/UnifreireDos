            debugger;
            const after = new Date().getTime();

                // Potential DevTools open
            }
        }, 2000);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const careerId = localStorage.getItem('carreraSeleccionada');
            let careerName = "Carrera no seleccionada";
            if(careerId && CAREERS_DATA[careerId]) {
                careerName = CAREERS_DATA[careerId].name;
            }
            document.getElementById('f-carrera').value = careerName;
        });

                document.getElementById('admission-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const formAnswers = {
                nombre: document.getElementById('f-nombre').value.trim(),
                carrera: document.getElementById('f-carrera').value,
                telefono: document.getElementById('f-telefono').value.trim(),
                email: document.getElementById('f-email').value.trim(),
                horario: document.getElementById('f-modalidad').value,
                fecha: (() => {
                    const d = new Date();
                    const pad = n => n.toString().padStart(2, '0');
                    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}/${pad(d.getHours())}:${pad(d.getMinutes())}`;
                })()
            };

            // Validación estricta solicitada
            if (!formAnswers.nombre || !formAnswers.telefono || !formAnswers.email || !formAnswers.horario) {
                alert("Sin tu información no podremos enviarte informacion completa de la carrera de tu interes, favor de rellenar cada seccion");
                return;
            }
            
            const btn = this.querySelector('button[type="submit"]');
            btn.innerText = "Enviando...";
            btn.disabled = true;

            let leads = JSON.parse(localStorage.getItem('unifreire_leads') || '[]');
            leads.push(formAnswers);
            localStorage.setItem('unifreire_leads', JSON.stringify(leads));

            // AES-256 Payload Encryption
            const SECRET_KEY = "UNIFREIRE_SECURE_KEY_2026_!@#";
            let encryptedPayload = "";
            try {
                encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(formAnswers), SECRET_KEY).toString();
            } catch(err) { console.error(err); }

            const urlGoogleAppsScript = GLOBAL_BACKEND_URL;
            const formParams = new URLSearchParams({
                action: "registro",
                payload_seguro: encryptedPayload, // Cifrado E2E
                nombre: formAnswers.nombre,
                correo: formAnswers.email,
                telefono: formAnswers.telefono,
                interes: formAnswers.carrera,
                tipo: formAnswers.horario
            });

            fetch(urlGoogleAppsScript, {
                method: "POST",
                body: formParams,
                mode: "no-cors"
            }).finally(() => {
                document.getElementById('success-message').style.display = 'block';
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 3000);
            });
        });
    </script>
